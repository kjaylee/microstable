[package]
name = "microstable"
version = "0.1.0"
description = "microstable Anchor program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "microstable"

[features]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
