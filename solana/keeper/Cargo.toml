[package]
name = "microstable-keeper"
version = "0.1.0"
edition = "2021"
description = "Microstable keeper daemon (oracle, circuit breaker, rebalance, watchdog)"
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
anchor-client = "0.31.1"
borsh = "1.5"
bincode = "1"
clap = { version = "4.5", features = ["derive", "env"] }
pyth-sdk-solana = "0.10.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-client = "2.3.0"
solana-sdk = "2.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
libc = "0.2"

[build-dependencies]
sha2 = "0.10"
