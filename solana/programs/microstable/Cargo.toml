[package]
name = "microstable"
version = "0.1.0"
description = "Microstable Anchor program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "microstable"

[features]
default = ["no-idl", "no-log-ix-name"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
